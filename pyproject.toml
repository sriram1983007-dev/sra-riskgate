[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sra-riskgate"
version = "0.13.1"
description = "Fail-closed checks for AI-agent USDC payments: OFAC SDN match, payee policy, limits, depeg, unsafe token approvals in transactions and x402 signatures, and dispute-window verdicts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sriram Ramakrishnan" }]
dependencies = ["pydantic>=2.0"]
keywords = ["stablecoin", "usdc", "payments", "x402", "ai-agents", "agent-safety", "guardrails", "llm", "mcp", "langchain", "crewai", "agentkit", "erc20", "eip-3009", "eip-712", "eip-7702", "base", "arc", "circle", "circle-gateway", "nanopayments", "ofac", "sanctions", "compliance", "risk", "fintech"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/sriram1983007-dev/sra-riskgate"
Documentation = "https://github.com/sriram1983007-dev/sra-riskgate#readme"
Changelog = "https://github.com/sriram1983007-dev/sra-riskgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/sriram1983007-dev/sra-riskgate/issues"
Model = "https://huggingface.co/sriram1983007/SRA-RiskGate-4B"
Benchmark = "https://huggingface.co/datasets/sriram1983007/sra-stablecoin-risk-bench"
"MCP server" = "https://pypi.org/project/sra-riskgate-mcp/"
"LangChain integration" = "https://pypi.org/project/langchain-sra-riskgate/"

[project.optional-dependencies]
# solana is pinned because coinbase-agentkit 0.7.4 fails to import with solana 0.40.x
agentkit = ["coinbase-agentkit>=0.7.4,<0.8", "solana>=0.36.6,<0.37"]
x402 = ["x402[evm]>=2.25,<3"]
test = ["pytest>=7", "eth-abi>=5"]

[tool.setuptools.packages.find]
include = ["sra_riskgate*"]

[tool.setuptools.package-data]
sra_riskgate = ["data/*.txt"]
