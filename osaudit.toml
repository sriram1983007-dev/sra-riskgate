schema = "https://github.com/ASSERT-KTH/assert-research-agent/blob/main/schemas/audit-v1.json"

# Open-science audit of the paper (https://github.com/ASSERT-KTH/osaudit).
# Every number in paper/main.tex is traced to a results file below, derived from one, or allowed with a reason.
# Results files are produced by paper/run_study.sh, which runs each instrument through `osaudit run`.

[paper]
tex = ["paper/main.tex"]

[results]
files = ["paper/results/*.json"]
instruments = ["paper/study/*.py"]

[[results.depends]]
file = "paper/results/benchmark.json"
instruments = ["paper/study/benchmark.py", "paper/study/_common.py"]

[[results.depends]]
file = "paper/results/failures.json"
instruments = ["paper/study/failures.py", "paper/study/_common.py"]

[[results.depends]]
file = "paper/results/real_world.json"
instruments = ["paper/study/real_world.py", "paper/study/_common.py"]

[[results.depends]]
file = "paper/results/library.json"
instruments = ["paper/study/library.py", "paper/study/_common.py"]

[[numbers.derive]]
value = "16.8"
expr = "16 * 16 * 16 * 16 * 16 * 16 / 1000000"

[[numbers.allow]]
value = "2025"
reason = "publication year of cited standards and documents"

[[numbers.allow]]
value = "2026"
reason = "year of this paper, of its data window and of cited documents"

