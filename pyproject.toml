[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sra-riskgate"
version = "0.8.0"
description = "Fail-closed checks for stablecoin and AI-agent payments: OFAC SDN address match, counterparty policy, limits, depeg and self-asserted claims"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sriram Ramakrishnan" }]
dependencies = ["pydantic>=2.0"]
keywords = ["stablecoin", "payments", "compliance", "risk", "x402", "usdc", "agentkit", "ai-agents", "ofac", "sanctions"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://huggingface.co/sriram1983007/SRA-RiskGate-4B"
Dataset = "https://huggingface.co/datasets/sriram1983007/sra-stablecoin-risk-bench"
Repository = "https://github.com/sriram1983007-dev/sra-riskgate"
Changelog = "https://github.com/sriram1983007-dev/sra-riskgate/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# solana is pinned because coinbase-agentkit 0.7.4 fails to import with solana 0.40.x
agentkit = ["coinbase-agentkit>=0.7.4,<0.8", "solana>=0.36.6,<0.37"]
x402 = ["x402[evm]>=2.25,<3"]
test = ["pytest>=7", "eth-abi>=5"]

[tool.setuptools.packages.find]
include = ["sra_riskgate*"]

[tool.setuptools.package-data]
sra_riskgate = ["data/*.txt"]
