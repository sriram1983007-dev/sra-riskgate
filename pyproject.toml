[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sra-riskgate"
version = "1.10.0"
description = "The pre-sign firewall for AI agents that pay: fail-closed checks, spend budgets, signed receipts and one policy file for stablecoin and x402 payments (USDC, USDT, USDB, USDG)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Sriram Ramakrishnan" }]
dependencies = ["pydantic>=2.0"]
keywords = ["stablecoin", "usdc", "usdt", "usdg", "usdb", "tether", "paxos", "bridge", "robinhood-chain", "permit", "allowance", "payments", "x402", "ai-agents", "agent-safety", "guardrails", "llm", "mcp", "langchain", "crewai", "agentkit", "erc20", "eip-3009", "eip-712", "eip-7702", "address-poisoning", "base", "arc", "circle", "circle-gateway", "circle-wallets", "nanopayments", "settlement", "receipts", "spend-limits", "budgets", "audit-trail", "policy-as-code", "firewall", "ofac", "sanctions", "compliance", "risk", "fintech"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/sriram1983007-dev/sra-riskgate"
Documentation = "https://github.com/sriram1983007-dev/sra-riskgate#readme"
Changelog = "https://github.com/sriram1983007-dev/sra-riskgate/blob/main/CHANGELOG.md"
Issues = "https://github.com/sriram1983007-dev/sra-riskgate/issues"
Model = "https://huggingface.co/sriram1983007/SRA-RiskGate-4B"
Benchmark = "https://huggingface.co/datasets/sriram1983007/sra-stablecoin-risk-bench"
"MCP server" = "https://pypi.org/project/sra-riskgate-mcp/"
"LangChain integration" = "https://pypi.org/project/langchain-sra-riskgate/"
"Live demo" = "https://huggingface.co/spaces/sriram1983007/sra-riskgate-demo"
Paper = "https://doi.org/10.5281/zenodo.23715017"
"Become a design partner" = "https://github.com/sriram1983007-dev/sra-riskgate/issues/new?title=Design%20partner%3A%20"

[project.scripts]
sra-riskgate = "sra_riskgate.cli:main"

[project.optional-dependencies]
# solana is pinned because coinbase-agentkit 0.7.4 fails to import with solana 0.40.x
agentkit = ["coinbase-agentkit>=0.7.4,<0.8", "solana>=0.36.6,<0.37"]
x402 = ["x402[evm]>=2.25,<3"]
circle = ["circle-developer-controlled-wallets>=9"]
receipts = ["eth-account>=0.10"]
policy-yaml = ["pyyaml>=6"]
test = ["pytest>=7", "eth-abi>=5"]

[tool.setuptools.packages.find]
include = ["sra_riskgate*"]

[tool.setuptools.package-data]
sra_riskgate = ["data/*.txt"]
